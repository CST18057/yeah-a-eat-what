name: Release gate proof

# Repeat runs are compared by the report's normalized resultFingerprint.
on:
  push:
    branches:
      - "agent/niuma20/release-gate-proof"

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release-gate tooling
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install browser runtime
        run: npx playwright install --with-deps chromium
        working-directory: lunch-picker

      - name: Run release gate
        run: |
          node tools/release-gate/release-gate.js \
            --repo https://github.com/CST18057/yeah-a-eat-what.git \
            --ref 1033f3f5fc97dc5bea98c913764a349582aceb22 \
            --output release-gate.json

      - name: Upload release-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-1033f3f
          path: release-gate.json
          if-no-files-found: error
